<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Power Up! Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <div class="container py-4" style="max-width: 1100px;">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <span class="fw-bold fs-5">✦ Power Up!</span>
            <span class="text-muted small">Your learning, in progress.</span>
        </header>

        <section class="p-4 p-md-5 mb-4 rounded-4" style="background-color: #e6efe9;">
            <div class="text-uppercase small fw-semibold text-success mb-2">Personal Learning Portfolio</div>
            <h1 class="display-6 fw-bold mb-2">Your growth deserves a place to live.</h1>
            <p class="text-muted mb-0">Capture what you enjoy, what you've tried, and what you learned.</p>
        </section>

        <div class="row g-4">
            <!-- ฝั่งซ้าย: แสดง Portfolios และ Items ทั้งหมดจากเซิร์ฟเวอร์ -->
            <div class="col-lg-7" id="portfolio-list"></div>

            <!-- ฝั่งขวา: ฟอร์มสร้าง Portfolio และฟอร์มเพิ่ม Item -->
            <div class="col-lg-5">
                <!-- ฟอร์ม 1: Create a portfolio -->
                <div class="card p-4 mb-4 text-white border-0 rounded-4" style="background-color: #183132;">
                    <h2 class="h4 fw-bold mb-1">Create a portfolio</h2>
                    <p class="small text-white-50 mb-3">Save your Portfolio to the server.</p>

                    <form id="profile-form">
                        <div class="mb-3">
                            <label for="displayName" class="form-label small">Display name *</label>
                            <input id="displayName" name="displayName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="enjoy" class="form-label small">What I enjoy</label>
                            <input id="enjoy" name="whatIEnjoy" class="form-control" placeholder="e.g. Designing websites">
                        </div>
                        <div class="mb-3">
                            <label for="tried" class="form-label small">What I've tried</label>
                            <input id="tried" name="whatIveTried" class="form-control" placeholder="e.g. My first group project">
                        </div>
                        <div class="mb-3">
                            <label for="curious" class="form-label small">What I'm curious about</label>
                            <input id="curious" name="whatImCuriousAbout" class="form-control" placeholder="e.g. Cloud computing">
                        </div>
                        <p id="profile-error" class="text-warning small mb-2"></p>
                        <button type="submit" class="btn btn-success w-100 fw-semibold">Create portfolio</button>
                    </form>
                </div>

                <!-- ฟอร์ม 2: Add a learning item -->
                <div class="card p-4 border-0 shadow-sm rounded-4">
                    <h2 class="h5 fw-bold mb-1">Add a learning item</h2>
                    <p class="small text-muted mb-3">Attach an item to a portfolio.</p>

                    <form id="item-form">
                        <div class="mb-2">
                            <label for="item-portfolio-id" class="form-label small">Select Portfolio *</label>
                            <select id="item-portfolio-id" name="portfolioId" class="form-select" required></select>
                        </div>
                        <div class="mb-2">
                            <label for="item-title" class="form-label small">Title *</label>
                            <input id="item-title" name="title" class="form-control" placeholder="e.g. Deployed EC2 Server" required>
                        </div>
                        <div class="mb-2">
                            <label for="item-skills" class="form-label small">Skills</label>
                            <input id="item-skills" name="skills" class="form-control" placeholder="e.g. Linux, Apache, PHP">
                        </div>
                        <div class="mb-2">
                            <label for="item-evidence" class="form-label small">Evidence</label>
                            <input id="item-evidence" name="evidence" class="form-control" placeholder="e.g. GitHub repo or live URL">
                        </div>
                        <div class="mb-2">
                            <label for="item-whatIDid" class="form-label small">What I did</label>
                            <input id="item-whatIDid" name="whatIDid" class="form-control" placeholder="e.g. Configured Apache and PHP">
                        </div>
                        <div class="mb-3">
                            <label for="item-nextStep" class="form-label small">Next step</label>
                            <input id="item-nextStep" name="nextStep" class="form-control" placeholder="e.g. Connect database">
                        </div>
                        <p id="item-error" class="text-danger small mb-2"></p>
                        <button type="submit" class="btn btn-dark w-100 fw-semibold">Add item</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
